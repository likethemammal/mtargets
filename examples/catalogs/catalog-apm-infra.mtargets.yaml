# Generated by scripts/generate-metric-catalogs.ts — full indicator examples
apiVersion: mtargets/v1
kind: MetricCatalog
metadata:
  id: catalog-apm-infra
  title: APM & infrastructure (41–60)
  version: 1.0.0
  tags:
    - apm
    - red
    - use
    - infra
spec:
  subjects:
    - id: api
      type: service
      title: Primary API
      selectors:
        service: api
        route: ALL
    - id: host
      type: system
      title: Host / node
      selectors:
        environment: production
  indicators:
    - id: request-rate
      title: Request rate (RPS)
      kind: gauge
      unit: count
      higherIsWorse: false
      aggregate: rate
      window:
        type: rolling
        duration: 5m
      source:
        type: promql
        query: sum(rate(http_requests_total[5m]))
      subjectRef: api
    - id: http-5xx-rate
      title: HTTP 5xx error rate
      kind: ratio
      unit: "1"
      higherIsWorse: true
      aggregate: rate
      window:
        type: rolling
        duration: 5m
      source:
        type: events
        bad:
          statusClass: 5xx
        total:
          all: true
      subjectRef: api
    - id: latency-p50
      title: Latency p50
      kind: timing
      unit: ms
      higherIsWorse: true
      aggregate: p50
      window: ci
      source:
        type: promql
        query: histogram_quantile(0.50,
          sum(rate(http_request_duration_seconds_bucket[5m])) by (le))
      subjectRef: api
    - id: latency-p95
      title: Latency p95
      kind: timing
      unit: ms
      higherIsWorse: true
      aggregate: p95
      window: ci
      source:
        type: promql
        query: histogram_quantile(0.95,
          sum(rate(http_request_duration_seconds_bucket[5m])) by (le))
      subjectRef: api
    - id: latency-p99
      title: Latency p99
      kind: timing
      unit: ms
      higherIsWorse: true
      aggregate: p99
      window: ci
      source:
        type: promql
        query: histogram_quantile(0.99,
          sum(rate(http_request_duration_seconds_bucket[5m])) by (le))
      subjectRef: api
    - id: apdex
      title: Apdex score
      kind: score
      unit: score
      higherIsWorse: false
      aggregate: avg
      window: ci
      source:
        type: custom
        query: apm.apdex
        params:
          satisfiedMs: 100
          toleratingMs: 400
      subjectRef: api
    - id: availability
      title: Availability
      kind: ratio
      unit: "1"
      higherIsWorse: false
      aggregate: rate
      window:
        type: rolling
        duration: 30d
      source:
        type: http
        query:
          method: GET
          path: /health
        params:
          up: true
      subjectRef: api
    - id: saturation-queue
      title: Request queue depth (saturation)
      kind: gauge
      unit: count
      higherIsWorse: true
      aggregate: last
      window: ci
      source:
        type: promql
        query: http_server_queue_depth
      subjectRef: api
    - id: cpu-util
      title: CPU utilization
      kind: gauge
      unit: "1"
      higherIsWorse: true
      aggregate: avg
      window: ci
      source:
        type: promql
        query: 1 - avg(rate(node_cpu_seconds_total{mode="idle"}[5m]))
      subjectRef: host
    - id: mem-util
      title: Memory utilization
      kind: gauge
      unit: "1"
      higherIsWorse: true
      aggregate: avg
      window: ci
      source:
        type: promql
        query: 1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)
      subjectRef: host
    - id: disk-util
      title: Disk I/O utilization
      kind: gauge
      unit: "1"
      higherIsWorse: true
      aggregate: avg
      window: ci
      source:
        type: promql
        query: rate(node_disk_io_time_seconds_total[5m])
      subjectRef: host
    - id: disk-saturation
      title: Disk queue saturation
      kind: gauge
      unit: count
      higherIsWorse: true
      aggregate: avg
      window: ci
      source:
        type: promql
        query: node_disk_io_now
      subjectRef: host
    - id: nic-util
      title: Network bandwidth utilization
      kind: gauge
      unit: "1"
      higherIsWorse: true
      aggregate: avg
      window: ci
      source:
        type: custom
        query: host.nic_utilization
      subjectRef: host
    - id: nic-errors
      title: Network interface errors
      kind: count
      unit: count
      higherIsWorse: true
      aggregate: sum
      window:
        type: rolling
        duration: 1h
      source:
        type: promql
        query: sum(rate(node_network_receive_errs_total[5m]))
      subjectRef: host
    - id: db-query-p95
      title: DB query latency p95
      kind: timing
      unit: ms
      higherIsWorse: true
      aggregate: p95
      window: ci
      source:
        type: promql
        query: histogram_quantile(0.95, sum(rate(db_query_duration_seconds_bucket[5m]))
          by (le))
      subjectRef: api
    - id: db-pool-sat
      title: DB pool saturation
      kind: gauge
      unit: "1"
      higherIsWorse: true
      aggregate: last
      window: ci
      source:
        type: custom
        query: db.pool_wait_ratio
      subjectRef: api
    - id: server-cache-hit
      title: Server cache hit ratio
      kind: ratio
      unit: "1"
      higherIsWorse: false
      aggregate: rate
      window: ci
      source:
        type: custom
        query: cache.server_hit_ratio
        good:
          hit: true
        total:
          lookup: true
      subjectRef: api
    - id: gc-pause
      title: GC pause time
      kind: timing
      unit: ms
      higherIsWorse: true
      aggregate: p95
      window: ci
      source:
        type: promql
        query: go_gc_duration_seconds
      subjectRef: api
    - id: threadpool-queue
      title: Thread pool queue depth
      kind: gauge
      unit: count
      higherIsWorse: true
      aggregate: last
      window: ci
      source:
        type: custom
        query: runtime.threadpool_queue
      subjectRef: api
    - id: consumer-lag
      title: Message consumer lag
      kind: gauge
      unit: count
      higherIsWorse: true
      aggregate: last
      window: ci
      source:
        type: promql
        query: kafka_consumergroup_lag
      subjectRef: api
    - id: cold-start
      title: Serverless cold start
      kind: timing
      unit: ms
      higherIsWorse: true
      aggregate: p95
      window: ci
      source:
        type: custom
        query: lambda.cold_start_ms
      subjectRef: api
