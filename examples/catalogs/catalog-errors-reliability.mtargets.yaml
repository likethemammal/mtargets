# Generated by scripts/generate-metric-catalogs.ts — full indicator examples
apiVersion: mtargets/v1
kind: MetricCatalog
metadata:
  id: catalog-errors-reliability
  title: Errors & reliability (61–75)
  version: 1.0.0
  tags:
    - errors
    - sentry
    - reliability
    - slo
spec:
  subjects:
    - id: app
      type: service
      title: Application
      selectors:
        service: app
        environment: production
  indicators:
    - id: unhandled-exception-rate
      title: Unhandled exception rate
      kind: ratio
      unit: "1"
      higherIsWorse: true
      aggregate: rate
      window:
        type: rolling
        duration: 24h
      source:
        type: sentry
        query: is:unresolved event.type:error
        params:
          metric: error_rate
        credentialsRef: sentry-api-token
      subjectRef: app
    - id: unresolved-issues
      title: Unresolved issue count
      kind: count
      unit: count
      higherIsWorse: true
      aggregate: last
      window: ci
      source:
        type: sentry
        query: is:unresolved
        params:
          metric: issue_count
        credentialsRef: sentry-api-token
      subjectRef: app
    - id: crash-free-sessions
      title: Crash-free sessions
      kind: ratio
      unit: "1"
      higherIsWorse: false
      aggregate: rate
      window:
        type: rolling
        duration: 7d
      source:
        type: custom
        query: mobile.crash_free_sessions
      subjectRef: app
    - id: crash-free-users
      title: Crash-free users
      kind: ratio
      unit: "1"
      higherIsWorse: false
      aggregate: rate
      window:
        type: rolling
        duration: 7d
      source:
        type: custom
        query: mobile.crash_free_users
      subjectRef: app
    - id: error-budget-burn
      title: Error budget burn rate (1h)
      kind: gauge
      unit: "1"
      higherIsWorse: true
      aggregate: last
      window:
        type: rolling
        duration: 1h
      source:
        type: custom
        query: slo.burn_rate
        params:
          window: 1h
      subjectRef: app
    - id: frontend-js-error-rate
      title: Frontend JS error rate
      kind: ratio
      unit: "1"
      higherIsWorse: true
      aggregate: rate
      window: ci
      source:
        type: glitchtip
        query: event.type:error
        params:
          metric: error_rate
          baseUrlEnv: GLITCHTIP_URL
        credentialsRef: glitchtip-token
      subjectRef: app
    - id: unhandled-rejection-rate
      title: Unhandled promise rejection rate
      kind: ratio
      unit: "1"
      higherIsWorse: true
      aggregate: rate
      window: ci
      source:
        type: events
        bad:
          type: unhandledrejection
        total:
          pageview: true
      subjectRef: app
    - id: http-4xx-rate
      title: HTTP 4xx rate
      kind: ratio
      unit: "1"
      higherIsWorse: true
      aggregate: rate
      window: ci
      source:
        type: events
        bad:
          statusClass: 4xx
        total:
          all: true
      subjectRef: app
    - id: auth-failure-rate
      title: Auth failure rate
      kind: ratio
      unit: "1"
      higherIsWorse: true
      aggregate: rate
      window: ci
      source:
        type: logql
        query: '{service="auth"} |= "auth.failure"'
        params:
          as: rate
      subjectRef: app
    - id: timeout-rate
      title: Request timeout rate
      kind: ratio
      unit: "1"
      higherIsWorse: true
      aggregate: rate
      window: ci
      source:
        type: events
        bad:
          error: timeout
        total:
          all: true
      subjectRef: app
    - id: circuit-open-count
      title: Circuit breaker opens
      kind: count
      unit: count
      higherIsWorse: true
      aggregate: sum
      window:
        type: rolling
        duration: 1h
      source:
        type: custom
        query: resilience.circuit_open_count
      subjectRef: app
    - id: retry-rate
      title: Client retry rate
      kind: ratio
      unit: "1"
      higherIsWorse: true
      aggregate: rate
      window: ci
      source:
        type: custom
        query: client.retry_ratio
      subjectRef: app
    - id: dlq-depth
      title: Dead letter queue depth
      kind: gauge
      unit: count
      higherIsWorse: true
      aggregate: last
      window: ci
      source:
        type: promql
        query: queue_dlq_messages
      subjectRef: app
    - id: fatal-count
      title: Fatal / panic count
      kind: count
      unit: count
      higherIsWorse: true
      aggregate: sum
      window:
        type: rolling
        duration: 24h
      source:
        type: logql
        query: '{severity="fatal"} or {severity="panic"}'
      subjectRef: app
    - id: new-unique-issues
      title: New unique issues
      kind: count
      unit: count
      higherIsWorse: true
      aggregate: sum
      window:
        type: calendar
        calendar: day
      source:
        type: sentry
        query: is:unresolved firstSeen:-24h
        params:
          metric: issue_count
      subjectRef: app
