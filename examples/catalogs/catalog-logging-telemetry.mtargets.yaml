# Generated by scripts/generate-metric-catalogs.ts — full indicator examples
apiVersion: mtargets/v1
kind: MetricCatalog
metadata:
  id: catalog-logging-telemetry
  title: Logging & telemetry health (76–90)
  version: 1.0.0
  tags:
    - logging
    - otel
    - cardinality
    - traces
spec:
  subjects:
    - id: telemetry
      type: system
      title: Telemetry pipeline
      selectors:
        environment: production
  indicators:
    - id: log-volume-eps
      title: Log volume (events/s)
      kind: gauge
      unit: count
      higherIsWorse: true
      aggregate: rate
      window:
        type: rolling
        duration: 5m
      source:
        type: promql
        query: sum(rate(log_events_total[5m]))
      subjectRef: telemetry
    - id: error-log-rate
      title: Error-severity log rate
      kind: gauge
      unit: count
      higherIsWorse: true
      aggregate: rate
      window: ci
      source:
        type: logql
        query: '{severity=~"error|fatal"}'
      subjectRef: telemetry
    - id: warn-log-rate
      title: Warn log rate
      kind: gauge
      unit: count
      higherIsWorse: true
      aggregate: rate
      window: ci
      source:
        type: logql
        query: '{severity="warn"}'
      subjectRef: telemetry
    - id: log-ingest-lag
      title: Log ingest lag
      kind: timing
      unit: s
      higherIsWorse: true
      aggregate: p95
      window: ci
      source:
        type: custom
        query: logs.ingest_lag_seconds
      subjectRef: telemetry
    - id: metric-cardinality
      title: Active metric series cardinality
      kind: gauge
      unit: count
      higherIsWorse: true
      aggregate: last
      window: ci
      source:
        type: custom
        query: metrics.active_series
      subjectRef: telemetry
    - id: pii-in-logs
      title: PII detections in logs
      kind: count
      unit: count
      higherIsWorse: true
      aggregate: sum
      window:
        type: rolling
        duration: 24h
      source:
        type: custom
        query: logs.pii_detection_count
      subjectRef: telemetry
    - id: log-parse-failure-rate
      title: Log parse failure rate
      kind: ratio
      unit: "1"
      higherIsWorse: true
      aggregate: rate
      window: ci
      source:
        type: custom
        query: logs.parse_failure_ratio
        bad:
          parse: fail
        total:
          ingest: true
      subjectRef: telemetry
    - id: span-error-rate
      title: Trace span error rate
      kind: ratio
      unit: "1"
      higherIsWorse: true
      aggregate: rate
      window: ci
      source:
        type: traceql
        query: "{ status=error }"
      subjectRef: telemetry
    - id: trace-sample-rate
      title: Observed trace sample rate
      kind: gauge
      unit: "1"
      higherIsWorse: false
      aggregate: avg
      window: ci
      source:
        type: custom
        query: traces.effective_sample_rate
      subjectRef: telemetry
    - id: span-duration-p95
      title: Span duration p95
      kind: timing
      unit: ms
      higherIsWorse: true
      aggregate: p95
      window: ci
      source:
        type: promql
        query: histogram_quantile(0.95, sum(rate(traces_spanmetrics_latency_bucket[5m]))
          by (le))
      subjectRef: telemetry
    - id: logs-derived-errors
      title: Logs-to-metrics error count
      kind: count
      unit: count
      higherIsWorse: true
      aggregate: sum
      window:
        type: rolling
        duration: 5m
      source:
        type: promql
        query: sum(increase(log_based_http_server_error_count[5m]))
      subjectRef: telemetry
    - id: mttr-hours
      title: MTTR (hours)
      kind: timing
      unit: s
      higherIsWorse: true
      aggregate: avg
      window:
        type: calendar
        calendar: month
      source:
        type: sql
        query: SELECT AVG(EXTRACT(EPOCH FROM restored_at - opened_at)) FROM incidents
          WHERE severity >= 2
      subjectRef: telemetry
    - id: log-retention-coverage
      title: Log retention coverage
      kind: ratio
      unit: "1"
      higherIsWorse: false
      aggregate: last
      window: ci
      source:
        type: custom
        query: logs.retention_coverage_ratio
      subjectRef: telemetry
    - id: trace-id-present
      title: Logs with trace_id present
      kind: ratio
      unit: "1"
      higherIsWorse: false
      aggregate: rate
      window: ci
      source:
        type: logql
        query: '{service=~".+"} | json | trace_id != ""'
      subjectRef: telemetry
    - id: dropped-telemetry-rate
      title: Dropped telemetry rate
      kind: ratio
      unit: "1"
      higherIsWorse: true
      aggregate: rate
      window: ci
      source:
        type: promql
        query: sum(rate(otelcol_processor_dropped_spans[5m])) /
          sum(rate(otelcol_receiver_accepted_spans[5m]))
      subjectRef: telemetry
