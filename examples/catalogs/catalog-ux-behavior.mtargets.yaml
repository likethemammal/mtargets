# Generated by scripts/generate-metric-catalogs.ts — full indicator examples
apiVersion: mtargets/v1
kind: MetricCatalog
metadata:
  id: catalog-ux-behavior
  title: UX behavior & product (91–100)
  version: 1.0.0
  tags:
    - ux
    - rum
    - frustration
    - funnel
spec:
  subjects:
    - id: product
      type: surface
      title: Product web app
      selectors:
        path: /*
        environment: production
    - id: checkout-flow
      type: flow
      title: Checkout funnel
      selectors:
        entry: /cart
        exit: /confirm
        steps:
          - cart
          - shipping
          - pay
          - confirm
  indicators:
    - id: rage-clicks
      title: Rage clicks per session
      kind: gauge
      unit: count
      higherIsWorse: true
      aggregate: avg
      window:
        type: rolling
        duration: 24h
      source:
        type: events
        query: frustration.rage_click
        params:
          per: session
      subjectRef: product
    - id: dead-clicks
      title: Dead clicks per session
      kind: gauge
      unit: count
      higherIsWorse: true
      aggregate: avg
      window: ci
      source:
        type: events
        query: frustration.dead_click
        params:
          per: session
      subjectRef: product
    - id: error-clicks
      title: Error clicks per session
      kind: gauge
      unit: count
      higherIsWorse: true
      aggregate: avg
      window: ci
      source:
        type: events
        query: frustration.error_click
        params:
          per: session
      subjectRef: product
    - id: thrashed-cursor
      title: Thrashed cursor events per session
      kind: gauge
      unit: count
      higherIsWorse: true
      aggregate: avg
      window: ci
      source:
        type: events
        query: frustration.thrashed_cursor
      subjectRef: product
    - id: scroll-depth
      title: Median scroll depth
      kind: gauge
      unit: "1"
      higherIsWorse: false
      aggregate: p50
      window: ci
      source:
        type: custom
        query: rum.scroll_depth_ratio
      subjectRef: product
    - id: bounce-rate
      title: Bounce rate
      kind: ratio
      unit: "1"
      higherIsWorse: true
      aggregate: rate
      window: ci
      source:
        type: events
        bad:
          bounce: true
        total:
          session: true
      subjectRef: product
    - id: session-duration
      title: Session duration
      kind: timing
      unit: s
      higherIsWorse: false
      aggregate: p50
      window: ci
      source:
        type: custom
        query: rum.session_duration_seconds
      subjectRef: product
    - id: task-success-rate
      title: Task success rate
      kind: ratio
      unit: "1"
      higherIsWorse: false
      aggregate: rate
      window: ci
      source:
        type: events
        good:
          event: task_success
        total:
          event: task_start
      subjectRef: checkout-flow
    - id: form-abandonment
      title: Form abandonment rate
      kind: ratio
      unit: "1"
      higherIsWorse: true
      aggregate: rate
      window: ci
      source:
        type: events
        bad:
          event: form_abandon
        total:
          event: form_start
      subjectRef: product
    - id: conversion-rate
      title: Checkout conversion rate
      kind: ratio
      unit: "1"
      higherIsWorse: false
      aggregate: rate
      window:
        type: rolling
        duration: 24h
      source:
        type: events
        good:
          event: checkout_confirm
        total:
          event: cart_view
      subjectRef: checkout-flow
