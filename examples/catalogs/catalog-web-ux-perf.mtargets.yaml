      aggregate: sum
      window: ci
      source:
        type: resource-budget
        query: total.count
      subjectRef: page
    - id: critical-chain-depth
      title: Critical request chain depth
      kind: gauge
      unit: count
      higherIsWorse: true
      aggregate: max
      window: ci
      source:
        type: lighthouse
        query: critical-request-chains
