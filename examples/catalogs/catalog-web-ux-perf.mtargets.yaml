        type: lighthouse
        query: speed-index
      subjectRef: page
    - id: tti
      title: Time to Interactive
      kind: timing
      unit: ms
      higherIsWorse: true
      aggregate: avg
      window: ci
      source:
        type: lighthouse
        query: interactive
      subjectRef: page
    - id: dcl
      title: DOM Content Loaded
      kind: timing
      unit: ms
      higherIsWorse: true
      aggregate: p75
      window: ci
      source:
