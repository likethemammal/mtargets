  indicators:
    - id: lcp
      title: Largest Contentful Paint
      kind: timing
      unit: ms
      higherIsWorse: true
      aggregate: p75
      window:
        type: rolling
        duration: 28d
      source:
        type: web-vitals
        query: lcp
      subjectRef: page
    - id: inp
      title: Interaction to Next Paint
      kind: timing
      unit: ms
      higherIsWorse: true
      aggregate: p75
      window:
        type: rolling
        duration: 28d
      source:
        type: web-vitals
        query: inp
      subjectRef: page
    - id: cls
      title: Cumulative Layout Shift
      kind: gauge
      unit: "1"
      higherIsWorse: true
      aggregate: p75
      window:
        type: rolling
        duration: 28d
      source:
        type: web-vitals
        query: cls
      subjectRef: page
    - id: fcp
      title: First Contentful Paint
      kind: timing
      unit: ms
      higherIsWorse: true
      aggregate: p75
      window: ci
      source:
        type: web-vitals
        query: fcp
      subjectRef: page
    - id: ttfb
      title: Time to First Byte
      kind: timing
      unit: ms
      higherIsWorse: true
      aggregate: p75
      window: ci
      source:
        type: web-vitals
        query: ttfb
      subjectRef: page
    - id: tbt
      title: Total Blocking Time
      kind: timing
      unit: ms
      higherIsWorse: true
