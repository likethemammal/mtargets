# Generated by scripts/generate-metric-catalogs.ts — full indicator examples
apiVersion: mtargets/v1
kind: MetricCatalog
metadata:
  id: catalog-web-ux-perf
  title: Web & UX performance (1–40)
  version: 1.0.0
  tags:
    - web
    - ux
    - lighthouse
    - rum
spec:
  subjects:
    - id: page
